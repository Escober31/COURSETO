<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — COURSETO</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg">
</head>
<body class="wallpaper-bg">

  <!-- Toast notification for account creation success or alerts -->
  <div id="toastNotice" class="toast-notice" role="alert" aria-live="polite">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
      <polyline points="22 4 12 14.01 9 11.01"></polyline>
    </svg>
    <span id="toastMessage">Account created successfully. Please sign in.</span>
  </div>

  <main class="auth-wrapper">
    <!-- Left Hero Section matching log in.png -->
    <section class="auth-hero">
      <h1 class="auth-hero-title">Welcome<br>Back</h1>
      <p class="auth-hero-desc">
        Sign in to continue to your projects, reporting, messages, and team workspace.
      </p>

      <!-- Social Media Icons (Facebook, Twitter, Instagram, Youtube) -->
      <div class="social-links" aria-label="Social media channels">
        <a href="#facebook" class="social-icon-btn" aria-label="Facebook" title="Facebook">
          <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
        </a>
        <a href="#twitter" class="social-icon-btn" aria-label="Twitter" title="Twitter">
          <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
            <path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.936 9.936 0 0024 4.59z"/>
          </svg>
        </a>
        <a href="#instagram" class="social-icon-btn" aria-label="Instagram" title="Instagram">
          <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
          </svg>
        </a>
        <a href="#youtube" class="social-icon-btn" aria-label="YouTube" title="YouTube">
          <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
            <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
          </svg>
        </a>
      </div>
    </section>

    <!-- Right Login Form Section matching log in.png -->
    <section class="auth-login-box">
      <h2 class="auth-login-title">Sign in</h2>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="emailInput" class="form-label">Email Address</label>
          <input 
            type="email" 
            id="emailInput" 
            name="email" 
            class="input-field" 
            placeholder=""
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="passwordInput" class="form-label">Password</label>
          <input 
            type="password" 
            id="passwordInput" 
            name="password" 
            class="input-field" 
            placeholder=""
            autocomplete="current-password"
            required
          >
          <div id="loginErrorMsg" class="error-message">Email/password is incorrect.</div>
        </div>

        <div class="form-check-row">
          <input type="checkbox" id="rememberMeCheckbox">
          <label for="rememberMeCheckbox" style="cursor: pointer;">Remember Me</label>
        </div>

        <button type="submit" id="signInBtn" class="btn-orange btn-hover-lift">
          Sign in now
        </button>

        <div class="auth-links">
          <a href="#lost-password" id="lostPasswordLink">Lost your password?</a>
          <a href="create-account.html" id="createAccountLink">Create account</a>
        </div>

        <p class="auth-footer-terms">
          By clicking on &ldquo;Sign in now&rdquo; you agree to <br>
          <a href="#terms">Terms of Service</a> | <a href="#privacy">Privacy Policy</a>
        </p>
      </form>
    </section>
  </main>

  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // If already logged in, redirect to dashboard
      AuthService.redirectIfAuthenticated('dashboard.html');

      const loginForm = document.getElementById('loginForm');
      const emailInput = document.getElementById('emailInput');
      const passwordInput = document.getElementById('passwordInput');
      const rememberMeCheckbox = document.getElementById('rememberMeCheckbox');
      const loginErrorMsg = document.getElementById('loginErrorMsg');
      const toastNotice = document.getElementById('toastNotice');
      const toastMessage = document.getElementById('toastMessage');

      // Check URL parameters for registration success
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('registered') === 'true') {
        showToast('Account created successfully. Please sign in.');
        // Clean URL
        window.history.replaceState({}, document.title, window.location.pathname);
      }

      // Prefill remembered email
      const rememberedEmail = AuthService.getRememberedEmail();
      if (rememberedEmail) {
        emailInput.value = rememberedEmail;
        rememberMeCheckbox.checked = true;
      }

      function showToast(msg) {
        toastMessage.textContent = msg;
        toastNotice.classList.add('show');
        setTimeout(() => {
          toastNotice.classList.remove('show');
        }, 4000);
      }

      function clearErrors() {
        emailInput.classList.remove('input-error');
        passwordInput.classList.remove('input-error');
        loginErrorMsg.classList.remove('visible');
      }

      // Reset error styling when user starts correcting the input
      emailInput.addEventListener('input', () => {
        emailInput.classList.remove('input-error');
        loginErrorMsg.classList.remove('visible');
      });

      passwordInput.addEventListener('input', () => {
        passwordInput.classList.remove('input-error');
        loginErrorMsg.classList.remove('visible');
      });

      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        clearErrors();

        const email = emailInput.value.trim();
        const password = passwordInput.value;
        const rememberMe = rememberMeCheckbox.checked;

        // Validation rule 1: Blank fields
        if (!email || !password) {
          if (!email) emailInput.classList.add('input-error');
          if (!password) passwordInput.classList.add('input-error');
          loginErrorMsg.textContent = 'Email/password is incorrect.';
          loginErrorMsg.classList.add('visible');
          return;
        }

        // Check authentication
        const result = AuthService.login(email, password, rememberMe);

        if (!result.success) {
          // Validation rule 2: Incorrect credentials
          emailInput.classList.add('input-error');
          passwordInput.classList.add('input-error');
          loginErrorMsg.textContent = 'Email/password is incorrect.';
          loginErrorMsg.classList.add('visible');
          return;
        }

        // Validation rule 3: Successful login -> redirect to dashboard
        window.location.href = 'dashboard.html';
      });

      // Lost password modal/notification
      document.getElementById('lostPasswordLink').addEventListener('click', (e) => {
        e.preventDefault();
        alert('Password recovery: Please create a new account or check your registered email.');
      });
    });
  </script>
</body>
</html>
