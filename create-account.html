<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — COURSETO</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg">
</head>
<body class="wallpaper-bg">

  <main class="auth-wrapper">
    <!-- Left Hero Section matching create account.png -->
    <section class="auth-hero">
      <h1 class="auth-hero-title">Welcome<br>Back</h1>
      <p class="auth-hero-desc">
        Sign in to continue to your projects, reporting, messages, and team workspace.
      </p>

      <!-- Social Media Icons (Facebook, Twitter, Instagram, Youtube) -->
      <div class="social-links" aria-label="Social media channels">
        <a href="#facebook" class="social-icon-btn" aria-label="Facebook" title="Facebook">
          <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
        </a>
        <a href="#twitter" class="social-icon-btn" aria-label="Twitter" title="Twitter">
          <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
            <path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.936 9.936 0 0024 4.59z"/>
          </svg>
        </a>
        <a href="#instagram" class="social-icon-btn" aria-label="Instagram" title="Instagram">
          <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
          </svg>
        </a>
        <a href="#youtube" class="social-icon-btn" aria-label="YouTube" title="YouTube">
          <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
            <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
          </svg>
        </a>
      </div>
    </section>

    <!-- Right Create Account Card matching create account.png -->
    <section class="auth-card-white">
      <h2 class="auth-card-title">Create<br>Account</h2>

      <form id="registerForm" novalidate>
        <!-- Field 1: Nickname (Required by prompt) -->
        <div class="form-group">
          <label for="nicknameInput" class="form-label-muted">NICKNAME</label>
          <input 
            type="text" 
            id="nicknameInput" 
            name="nickname" 
            class="input-field-light" 
            placeholder="Enter your nickname"
            autocomplete="nickname"
            required
          >
          <div id="nicknameError" class="error-message"></div>
        </div>

        <!-- Field 2: Full Name -->
        <div class="form-group">
          <label for="fullNameInput" class="form-label-muted">FULL NAME</label>
          <input 
            type="text" 
            id="fullNameInput" 
            name="fullName" 
            class="input-field-light" 
            placeholder="Enter your full name"
            autocomplete="name"
            required
          >
          <div id="fullNameError" class="error-message"></div>
        </div>

        <!-- Field 3: Email -->
        <div class="form-group">
          <label for="registerEmailInput" class="form-label-muted">YOUR E-MAIL</label>
          <input 
            type="email" 
            id="registerEmailInput" 
            name="email" 
            class="input-field-light" 
            placeholder="you@example.com"
            autocomplete="email"
            required
          >
          <div id="emailError" class="error-message"></div>
        </div>

        <!-- Field 4: Create Password -->
        <div class="form-group">
          <label for="registerPasswordInput" class="form-label-muted">CREATE PASSWORD</label>
          <input 
            type="password" 
            id="registerPasswordInput" 
            name="password" 
            class="input-field-light" 
            placeholder="At least 6 characters"
            autocomplete="new-password"
            required
          >
          <div id="passwordError" class="error-message"></div>
        </div>

        <!-- Field 5: Terms & Conditions Checkbox -->
        <div class="form-group" style="margin-bottom: 8px;">
          <div class="form-check-row form-check-row-light" style="margin: 4px 0 6px 0;">
            <input type="checkbox" id="termsCheckbox" required>
            <label for="termsCheckbox" style="cursor: pointer; font-size: 13px;">
              I agree to the <a href="#terms" style="text-decoration: underline; color: #475569;">Terms & Conditions</a>
            </label>
          </div>
          <div id="termsError" class="error-message"></div>
        </div>

        <!-- Field 6: Get Started Button -->
        <button type="submit" id="getStartedBtn" class="btn-blue-rounded btn-hover-lift">
          GET STARTED
        </button>

        <div class="divider-or">
          <span>or</span>
        </div>

        <div class="social-auth-grid">
          <button type="button" class="btn-social-fb btn-hover-lift" onclick="alert('Social sign-up with Facebook is not enabled in this demo.');">
            <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
              <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
            </svg>
            Facebook
          </button>
          <button type="button" class="btn-social-google btn-hover-lift" onclick="alert('Social sign-up with Google is not enabled in this demo.');">
            <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12.24 10.285V13.8h6.887C18.2 16.54 15.64 18 12.24 18c-3.32 0-6-2.69-6-6s2.68-6 6-6c1.47 0 2.82.53 3.87 1.41l2.67-2.67C17.13 3.24 14.81 2.4 12.24 2.4 6.98 2.4 2.7 6.69 2.7 11.95s4.28 9.55 9.54 9.55c5.5 0 9.14-3.86 9.14-9.3 0-.64-.06-1.27-.19-1.915H12.24z"/>
            </svg>
            Google
          </button>
        </div>

        <a href="index.html" class="back-to-signin-link">Back to sign in</a>
      </form>
    </section>
  </main>

  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Redirect if already authenticated
      AuthService.redirectIfAuthenticated('dashboard.html');

      const registerForm = document.getElementById('registerForm');
      const nicknameInput = document.getElementById('nicknameInput');
      const fullNameInput = document.getElementById('fullNameInput');
      const emailInput = document.getElementById('registerEmailInput');
      const passwordInput = document.getElementById('registerPasswordInput');
      const termsCheckbox = document.getElementById('termsCheckbox');

      const nicknameError = document.getElementById('nicknameError');
      const fullNameError = document.getElementById('fullNameError');
      const emailError = document.getElementById('emailError');
      const passwordError = document.getElementById('passwordError');
      const termsError = document.getElementById('termsError');

      // Helper to display error
      function showError(inputEl, errorEl, message) {
        if (inputEl) inputEl.classList.add('input-error');
        errorEl.textContent = message;
        errorEl.classList.add('visible');
      }

      // Helper to clear error
      function clearError(inputEl, errorEl) {
        if (inputEl) inputEl.classList.remove('input-error');
        errorEl.textContent = '';
        errorEl.classList.remove('visible');
      }

      // Clear errors on typing
      nicknameInput.addEventListener('input', () => clearError(nicknameInput, nicknameError));
      fullNameInput.addEventListener('input', () => clearError(fullNameInput, fullNameError));
      emailInput.addEventListener('input', () => clearError(emailInput, emailError));
      passwordInput.addEventListener('input', () => clearError(passwordInput, passwordError));
      termsCheckbox.addEventListener('change', () => clearError(null, termsError));

      registerForm.addEventListener('submit', (e) => {
        e.preventDefault();

        let isValid = true;

        // Clear all existing errors
        clearError(nicknameInput, nicknameError);
        clearError(fullNameInput, fullNameError);
        clearError(emailInput, emailError);
        clearError(passwordInput, passwordError);
        clearError(null, termsError);

        const rawNickname = nicknameInput.value;
        const trimmedNickname = rawNickname.trim();
        const fullName = fullNameInput.value.trim();
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        const termsChecked = termsCheckbox.checked;

        // 1. Nickname Validation:
        // Only alphabetic letters and spaces are allowed. Numbers & special characters are NOT allowed. Cannot be empty.
        const letterAndSpaceRegex = /^[A-Za-z\s]+$/;
        if (!trimmedNickname) {
          showError(nicknameInput, nicknameError, 'Nickname cannot be empty.');
          isValid = false;
        } else if (!letterAndSpaceRegex.test(rawNickname)) {
          showError(nicknameInput, nicknameError, 'Nickname can only contain letters and spaces.');
          isValid = false;
        }

        // 2. Full Name Validation:
        if (!fullName) {
          showError(fullNameInput, fullNameError, 'Full Name cannot be empty.');
          isValid = false;
        }

        // 3. Email Validation:
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!email) {
          showError(emailInput, emailError, 'Email address is required.');
          isValid = false;
        } else if (!emailRegex.test(email)) {
          showError(emailInput, emailError, 'Please enter a valid email address.');
          isValid = false;
        } else if (AuthService.findUserByEmail(email)) {
          showError(emailInput, emailError, 'An account with this email already exists.');
          isValid = false;
        }

        // 4. Password Validation:
        if (!password) {
          showError(passwordInput, passwordError, 'Password is required.');
          isValid = false;
        } else if (password.length < 6) {
          showError(passwordInput, passwordError, 'Password must be at least 6 characters.');
          isValid = false;
        }

        // 5. Terms & Conditions Validation:
        if (!termsChecked) {
          showError(null, termsError, 'You must agree to the Terms & Conditions.');
          isValid = false;
        }

        if (!isValid) return;

        // Register Account
        const result = AuthService.register({
          nickname: trimmedNickname,
          fullName: fullName,
          email: email,
          password: password
        });

        if (!result.success) {
          if (result.field === 'email') {
            showError(emailInput, emailError, result.message);
          } else {
            alert(result.message);
          }
          return;
        }

        // Redirect to Login page with registered parameter
        window.location.href = 'index.html?registered=true';
      });
    });
  </script>
</body>
</html>
